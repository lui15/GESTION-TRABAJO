# Publicación de la versión web (compilación estática, sin SSR).
[build]
  command = "npm run build"
  publish = "dist/gestion-trabajo/browser"

[build.environment]
  NODE_VERSION = "22"

# Aplicación de una sola página: todas las rutas sirven index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
